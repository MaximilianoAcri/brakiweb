<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SVG first for browsers that support it; PNGs for Safari, which does not,
         and apple-touch-icon for iOS home-screen bookmarks. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts are served from this origin (see src/fuentes.css). Preloading the
         two faces the first screen needs means they are in flight before the
         CSS that asks for them has even been parsed. -->
    <link rel="preload" href="/fonts/spectral-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>Estudio Jurídico Braki &amp; Asoc. | Abogados en Tapiales, Zona Oeste</title>
    <meta
      name="description"
      content="Estudio jurídico en Tapiales, Zona Oeste. Derecho laboral, ART, daños y perjuicios, civil, comercial y penal. Asesoramiento legal con atención personalizada. Consultá hoy."
    />
    <meta name="theme-color" content="#3B2A20" />
    <link rel="canonical" href="https://www.firmabrakiasoc.com.ar/" />

    <!-- Open Graph / WhatsApp / Facebook. og:url and og:image must be ABSOLUTE
         URLs, or the preview card does not render. The apex redirects to www
         (308), so www is the canonical host. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Estudio Jurídico Braki & Asoc." />
    <meta property="og:title" content="Estudio Jurídico Braki & Asoc. | Abogados en Tapiales" />
    <meta
      property="og:description"
      content="Defensa estratégica y soluciones concretas. Derecho laboral, ART, daños y perjuicios, civil, comercial y penal."
    />
    <meta property="og:url" content="https://www.firmabrakiasoc.com.ar/" />
    <meta property="og:image" content="https://www.firmabrakiasoc.com.ar/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Estudio Jurídico Braki & Asoc." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Estudio Jurídico Braki & Asoc. | Abogados en Tapiales" />
    <meta
      name="twitter:description"
      content="Defensa estratégica y soluciones concretas. Consultá hoy."
    />
    <meta name="twitter:image" content="https://www.firmabrakiasoc.com.ar/og-image.jpg" />

    <!-- Structured data: helps Google show the firm as a local business. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LegalService",
        "name": "Estudio Jurídico Braki & Asoc.",
        "description": "Asesoramiento legal integral con enfoque boutique.",
        "email": "braki.abogados@gmail.com",
        "telephone": "+5491164949605",
        "sameAs": ["https://www.instagram.com/braki.abogados/"],
        "areaServed": "Buenos Aires, Argentina",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Boulogne Sur Mer 820",
          "addressLocality": "Tapiales",
          "addressRegion": "Buenos Aires",
          "addressCountry": "AR"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        "founder": {
          "@type": "Person",
          "name": "Pablo Matías Braki",
          "jobTitle": "Abogado"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
